[project]
name = "industrial-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lizhiming", email = "lizhiming@tapinpet.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "numpy<2",
    "pymilvus",
    "sentence-transformers==3.2.1",
    "torch==2.2.2",
    "transformers==4.46.3",
]

[project.scripts]
industrial-ai = "industrial_ai:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
